version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/"
    # Direct tool pins only. The minimum-HA tool set is curated manually.
    # HA targets have independent security-update entries below.
    exclude-paths:
      - "requirements-dev-min-ha.txt"
      - "requirements/ha-current/**"
      - "requirements/ha-min/**"
    schedule:
      interval: "quarterly"
      time: "05:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 1
    groups:
      python-patch-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
    ignore:
      # Python majors are compatibility work, not routine maintenance.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Legacy SSH compatibility exception; fixes available only in >=4 need
      # manual security triage (see SECURITY.md). This does not suppress alerts.
      - dependency-name: "paramiko"
        versions:
          - ">=4"

  # Zero disables routine version PRs, not security-update PRs.
  # Keep targets separate so minimum/current pins are resolved independently.
  - package-ecosystem: "pip"
    directory: "/requirements/ha-min"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"

  - package-ecosystem: "pip"
    directory: "/requirements/ha-current"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
