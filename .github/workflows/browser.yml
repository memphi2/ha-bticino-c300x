name: Card Browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install browser test tools without package scripts
        run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Browser layouts, actions and media lifecycle
        run: node tests/browser/smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: synthetic-card-screenshots
          path: .artifacts/browser/*.png
          retention-days: 7
