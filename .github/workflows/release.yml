name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2.1.0 or v2.1.0b1"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RELEASE_ZIP: .release/ha-bticino-c300x.zip
  RELEASE_SHA256SUMS: .release/SHA256SUMS
  RELEASE_METADATA: .release/build-metadata.json
  RELEASE_SBOM: .release/sbom.spdx.json

jobs:
  validate:
    name: release validate (${{ matrix.name }})
    runs-on: ubuntu-26.04
    outputs:
      current-ha: ${{ steps.ha-version.outputs.current_ha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-ha
            python-version: "3.14"
            requirements-ha: requirements/ha-min/requirements.txt
            requirements-lock: requirements-dev-min-ha.txt
          - name: current-ha
            python-version: "3.14"
            requirements-ha: requirements/ha-current/requirements.txt
            requirements-lock: requirements-dev.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve Home Assistant version
        id: ha-version
        run: python scripts/resolve_ha_version.py "${{ matrix.name }}"
      - name: Install Python validation tools
        env:
          HA_VERSION: ${{ steps.ha-version.outputs.version }}
        run: |
          python -m pip install "homeassistant==$HA_VERSION" -r "${{ matrix.requirements-ha }}" -r "${{ matrix.requirements-lock }}"
          python -m pip check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install native agent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libcurl4-openssl-dev libturbojpeg0 pkg-config
      - name: Validation gates
        run: python scripts/check_validate.py
      - name: Home Assistant container runtime
        timeout-minutes: 10
        env:
          HA_VERSION: ${{ steps.ha-version.outputs.version }}
        run: |
          IMAGE="ghcr.io/home-assistant/home-assistant:$HA_VERSION"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=128m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 --entrypoint python "$IMAGE" \
            scripts/check_ha_container_runtime.py --expect-ha "$HA_VERSION"

  hacs:
    name: release hacs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration uses zip_release; these checks need the release asset,
          # so branch/PR validation covers the remaining HACS repository gates.
          ignore: hacsjson integration_manifest

  hassfest:
    name: release hassfest
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  main-validation:
    name: main validation gate
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.verified-main.outputs.commit }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Wait for canonical main validation
        id: verified-main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_sha, but origin/main is $main_sha"
            exit 1
          fi

          expected_jobs="dependabot,hacs,hassfest,validate (min-ha),validate (current-ha)"
          for attempt in $(seq 1 90); do
            runs_json="$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/actions/workflows/validate.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$tag_sha" \
              -f per_page=10)"

            run_summary="$(RUNS_JSON="$runs_json" TAG_SHA="$tag_sha" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RUNS_JSON"])
          tag_sha = os.environ["TAG_SHA"]
          runs = [
              run for run in data.get("workflow_runs", [])
              if run.get("head_sha") == tag_sha
          ]
          runs.sort(
              key=lambda run: run.get("run_started_at") or run.get("created_at") or "",
              reverse=True,
          )
          if not runs:
              print("missing\t\t")
          else:
              run = runs[0]
              print(
                  "\t".join(
                      [
                          str(run["id"]),
                          run.get("status") or "",
                          run.get("conclusion") or "",
                          run.get("html_url") or "",
                      ]
                  )
              )
          PY
          )"
            IFS=$'\t' read -r run_id run_status run_conclusion run_url <<EOF
          $run_summary
          EOF

            if [ "$run_id" = "missing" ]; then
              echo "Waiting for Validate workflow on main for $tag_sha ($attempt/90)"
              sleep 10
              continue
            fi
            if [ "$run_status" != "completed" ]; then
              echo "Validate workflow $run_id is $run_status: $run_url ($attempt/90)"
              sleep 10
              continue
            fi
            if [ "$run_conclusion" != "success" ]; then
              echo "::error::Validate workflow $run_id completed with $run_conclusion: $run_url"
              exit 1
            fi

            jobs_json="$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            JOBS_JSON="$jobs_json" EXPECTED_JOBS="$expected_jobs" python - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["JOBS_JSON"])
          jobs = {
              job.get("name"): job
              for job in data.get("jobs", [])
          }
          expected = set(os.environ["EXPECTED_JOBS"].split(","))
          missing = sorted(expected - set(jobs))
          bad = sorted(
              name for name in expected & set(jobs)
              if jobs[name].get("status") != "completed"
              or jobs[name].get("conclusion") != "success"
          )
          if missing or bad:
              if missing:
                  print(f"missing required Validate jobs: {', '.join(missing)}", file=sys.stderr)
              if bad:
                  print(f"unsuccessful required Validate jobs: {', '.join(bad)}", file=sys.stderr)
              sys.exit(1)
          PY
            echo "Canonical main Validate workflow succeeded for $tag_sha: $run_url"
            echo "commit=$tag_sha" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "::error::Timed out waiting for Validate workflow on main for $tag_sha"
          exit 1

  browser:
    name: release browser
    needs: main-validation
    uses: ./.github/workflows/browser.yml
    with:
      ref: ${{ needs.main-validation.outputs.commit }}

  publish:
    runs-on: ubuntu-26.04
    needs:
      - validate
      - hacs
      - hassfest
      - main-validation
      - browser
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install release validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/check_release_tag.py "$RELEASE_TAG" --attestation-context
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libcurl4-openssl-dev pkg-config
      - name: Release validation gates
        run: python scripts/check_repo.py
      - name: Resolve reusable native agent
        id: reusable-agent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # This checked-in approval is independent of all downloaded metadata.
          python scripts/native_build_lock.py --check-inputs
          if [ -n "${C300X_DEVICE_SYSROOT:-}" ] \
            && [ -f "${C300X_DEVICE_SYSROOT}/lib/libc.so.6" ]; then
            echo "asset_source=build" >> "$GITHUB_OUTPUT"
            echo "reuse_args=" >> "$GITHUB_OUTPUT"
            echo "reused_from=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="$(python scripts/release_version.py "$RELEASE_TAG")"
          mkdir -p .release/reuse
          # Prefer the locally built same-tag draft asset. An older asset is
          # usable only with the SAME current source/version/byte approval.
          for candidate in "$RELEASE_TAG" "$previous_tag"; do
            [ -n "$candidate" ] || continue
            rm -f .release/reuse/ha-bticino-c300x.zip
            if gh release download "$candidate" \
              --pattern ha-bticino-c300x.zip --dir .release/reuse --clobber \
              && python scripts/native_build_lock.py --zip .release/reuse/ha-bticino-c300x.zip; then
              echo "asset_source=build" >> "$GITHUB_OUTPUT"
              echo "reuse_args=--reuse-agent-from-release-zip .release/reuse/ha-bticino-c300x.zip" >> "$GITHUB_OUTPUT"
              echo "reused_from=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No release executable matches the reviewed native build lock; build locally and review its lock before release."
          exit 1
      - name: Build HACS release zip
        if: steps.reusable-agent.outputs.asset_source == 'build'
        run: scripts/build_hacs_release.py ${{ steps.reusable-agent.outputs.reuse_args }}
      - name: Bind packaged agent to selected build output
        run: |
          python scripts/check_release_contents.py "$RELEASE_ZIP" \
            --agent-binary native_agent/build/armhf/c300x-agent-native \
            --build-lock native_agent/build-lock.json
      - name: Generate release metadata
        if: steps.reusable-agent.outputs.asset_source == 'build'
        env:
          C300X_VALIDATED_CURRENT_HA_VERSION: ${{ needs.validate.outputs.current-ha }}
        run: |
          test -n "$C300X_VALIDATED_CURRENT_HA_VERSION"
          scripts/write_release_assets.py \
            --zip "$RELEASE_ZIP" \
            --tag "${{ steps.release-tag.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --native-agent-reused-from "${{ steps.reusable-agent.outputs.reused_from }}" \
            --sha256sums "$RELEASE_SHA256SUMS" \
            --metadata "$RELEASE_METADATA" \
            --sbom "$RELEASE_SBOM"
      - name: Validate SPDX SBOM
        run: pyspdxtools -i "$RELEASE_SBOM"
      - name: Verify release assets
        run: |
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_SHA256SUMS"
          test -s "$RELEASE_METADATA"
          test -s "$RELEASE_SBOM"
          (cd .release && sha256sum -c SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-bticino-c300x-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256SUMS }}
            ${{ env.RELEASE_METADATA }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
      - name: Generate artifact attestation
        id: provenance_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
      - name: Generate SBOM attestation
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
          sbom-path: ${{ env.RELEASE_SBOM }}
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.release-tag.outputs.ref }}
          RELEASE_COMMIT: ${{ steps.release-tag.outputs.commit }}
        run: |
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "${{ steps.provenance_attestation.outputs.bundle-path }}" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "${{ steps.sbom_attestation.outputs.bundle-path }}" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python scripts/publish_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --directory .release \
            --finalize-transport-draft
