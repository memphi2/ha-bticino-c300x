name: Build HACS Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hacs-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Build HACS release zip
        run: scripts/build_hacs_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ha-bticino-c300x
          path: .release/ha-bticino-c300x.zip
          if-no-files-found: error
      - name: Attach release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" .release/ha-bticino-c300x.zip --clobber
