name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.6.2"
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_ZIP: .release/ha-bticino-c300x.zip
  RELEASE_SHA256SUMS: .release/SHA256SUMS
  RELEASE_METADATA: .release/build-metadata.json
  RELEASE_SBOM: .release/sbom.spdx.json

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-ha
            python-version: "3.14"
            homeassistant: "2026.5.0"
            requirements-lock: requirements-dev-min-ha.lock
          - name: current-ha
            python-version: "3.14"
            homeassistant: "2026.7.1"
            requirements-lock: requirements-dev.lock
    name: validate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools
        run: |
          python -m pip install -r "${{ matrix.requirements-lock }}"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = "${{ matrix.homeassistant }}"
          actual = version("homeassistant")
          if actual != expected:
              raise SystemExit(f"homeassistant lock mismatch: expected {expected}, got {actual}")
          PY
      - name: Install native agent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Validation gates
        run: python scripts/check_validate.py

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration uses zip_release; these checks need the release asset,
          # so branch/PR validation covers the remaining HACS repository gates.
          ignore: hacsjson integration_manifest

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Hassfest
        uses: home-assistant/actions/hassfest@f4ca6f671bd429efb108c0f2fa0ae8af0215986c # master

  publish:
    runs-on: ubuntu-24.04
    needs:
      - validate
      - hacs
      - hassfest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Resolve release tag
        id: release-tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/check_release_tag.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Release validation gates
        run: python scripts/check_repo.py
      - name: Resolve reusable native agent
        id: reusable-agent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${C300X_DEVICE_SYSROOT:-}" ] \
            && [ -f "${C300X_DEVICE_SYSROOT}/lib/libc.so.6" ]; then
            echo "reuse_args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -F -x -v "$RELEASE_TAG" \
            | head -n 1 || true)"
          if [ -z "$previous_tag" ]; then
            echo "::error::C300X_DEVICE_SYSROOT is unavailable and no previous release tag exists for agent reuse"
            exit 1
          fi
          changed_inputs="$(git diff --name-only "$previous_tag..HEAD" -- \
            native_agent/src \
            native_agent/scripts \
            native_agent/VERSION \
            native_agent/Makefile \
            native_agent/config.example.json \
            device_qml \
            custom_components/bticino_c300x/device_agent/init \
            scripts/stage_device_agent_bundle.py)"
          if [ -n "$changed_inputs" ]; then
            printf '%s\n' "$changed_inputs"
            mkdir -p .release/reuse-current
            if gh release download "$RELEASE_TAG" \
              --pattern ha-bticino-c300x.zip \
              --pattern build-metadata.json \
              --dir .release/reuse-current \
              --clobber; then
              CURRENT_RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          metadata = json.loads(Path(".release/reuse-current/build-metadata.json").read_text())
          expected = {
              "release_tag": os.environ["CURRENT_RELEASE_TAG"],
              "git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True,
              ).strip(),
              "native_agent_version": Path("native_agent/VERSION").read_text().strip(),
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  print(f"current release asset metadata mismatch for {key}", file=sys.stderr)
                  sys.exit(1)
          bundle = metadata.get("device_agent_bundle") or {}
          if bundle.get("agent_version") != expected["native_agent_version"]:
              print("current release asset agent version mismatch", file=sys.stderr)
              sys.exit(1)
          PY
              test -s .release/reuse-current/ha-bticino-c300x.zip
              echo "reuse_args=--reuse-agent-from-release-zip .release/reuse-current/ha-bticino-c300x.zip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Native agent/bundle inputs changed since $previous_tag; C300X_DEVICE_SYSROOT or a verified current release asset is required"
            exit 1
          fi
          mkdir -p .release/reuse
          gh release download "$previous_tag" \
            --pattern ha-bticino-c300x.zip \
            --dir .release/reuse \
            --clobber
          test -s .release/reuse/ha-bticino-c300x.zip
          echo "reuse_args=--reuse-agent-from-release-zip .release/reuse/ha-bticino-c300x.zip" >> "$GITHUB_OUTPUT"
      - name: Build HACS release zip
        run: scripts/build_hacs_release.py ${{ steps.reusable-agent.outputs.reuse_args }}
      - name: Generate release metadata
        run: |
          scripts/write_release_assets.py \
            --zip "$RELEASE_ZIP" \
            --tag "${{ steps.release-tag.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --sha256sums "$RELEASE_SHA256SUMS" \
            --metadata "$RELEASE_METADATA" \
            --sbom "$RELEASE_SBOM"
      - name: Verify release assets
        run: |
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_SHA256SUMS"
          test -s "$RELEASE_METADATA"
          test -s "$RELEASE_SBOM"
          (cd .release && sha256sum -c SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ha-bticino-c300x-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256SUMS }}
            ${{ env.RELEASE_METADATA }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
      - name: Generate artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
      - name: Generate SBOM attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
          sbom-path: ${{ env.RELEASE_SBOM }}
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          assets=(
            "$RELEASE_ZIP"
            "$RELEASE_SHA256SUMS"
            "$RELEASE_METADATA"
            "$RELEASE_SBOM"
          )
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
