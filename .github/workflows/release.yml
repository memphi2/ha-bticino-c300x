name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.6.2"
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  RELEASE_ZIP: .release/ha-bticino-c300x.zip
  RELEASE_SHA256SUMS: .release/SHA256SUMS
  RELEASE_METADATA: .release/build-metadata.json
  RELEASE_SBOM: .release/sbom.spdx.json

jobs:
  validate:
    name: release validate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-ha
            python-version: "3.14"
            homeassistant: "2026.5.0"
            requirements-lock: requirements-dev-min-ha.txt
          - name: current-ha
            python-version: "3.14"
            homeassistant: "2026.8.1"
            requirements-lock: requirements-dev.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools
        run: |
          python -m pip install "homeassistant==${{ matrix.homeassistant }}"
          python -m pip install -r "${{ matrix.requirements-lock }}"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = "${{ matrix.homeassistant }}"
          actual = version("homeassistant")
          if actual != expected:
              raise SystemExit(f"homeassistant lock mismatch: expected {expected}, got {actual}")
          PY
      - name: Install native agent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Validation gates
        run: python scripts/check_validate.py

  hacs:
    name: release hacs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration uses zip_release; these checks need the release asset,
          # so branch/PR validation covers the remaining HACS repository gates.
          ignore: hacsjson integration_manifest

  hassfest:
    name: release hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Hassfest
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master

  main-validation:
    name: main validation gate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Wait for canonical main validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::Release tag $RELEASE_TAG points to $tag_sha, but origin/main is $main_sha"
            exit 1
          fi

          expected_jobs="dependabot,hacs,hassfest,validate (min-ha),validate (current-ha)"
          for attempt in $(seq 1 90); do
            runs_json="$(gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/actions/workflows/validate.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$tag_sha" \
              -f per_page=10)"

            run_summary="$(RUNS_JSON="$runs_json" TAG_SHA="$tag_sha" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RUNS_JSON"])
          tag_sha = os.environ["TAG_SHA"]
          runs = [
              run for run in data.get("workflow_runs", [])
              if run.get("head_sha") == tag_sha
          ]
          runs.sort(
              key=lambda run: run.get("run_started_at") or run.get("created_at") or "",
              reverse=True,
          )
          if not runs:
              print("missing\t\t")
          else:
              run = runs[0]
              print(
                  "\t".join(
                      [
                          str(run["id"]),
                          run.get("status") or "",
                          run.get("conclusion") or "",
                          run.get("html_url") or "",
                      ]
                  )
              )
          PY
          )"
            IFS=$'\t' read -r run_id run_status run_conclusion run_url <<EOF
          $run_summary
          EOF

            if [ "$run_id" = "missing" ]; then
              echo "Waiting for Validate workflow on main for $tag_sha ($attempt/90)"
              sleep 10
              continue
            fi
            if [ "$run_status" != "completed" ]; then
              echo "Validate workflow $run_id is $run_status: $run_url ($attempt/90)"
              sleep 10
              continue
            fi
            if [ "$run_conclusion" != "success" ]; then
              echo "::error::Validate workflow $run_id completed with $run_conclusion: $run_url"
              exit 1
            fi

            jobs_json="$(gh api \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            JOBS_JSON="$jobs_json" EXPECTED_JOBS="$expected_jobs" python - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["JOBS_JSON"])
          jobs = {
              job.get("name"): job
              for job in data.get("jobs", [])
          }
          expected = set(os.environ["EXPECTED_JOBS"].split(","))
          missing = sorted(expected - set(jobs))
          bad = sorted(
              name for name in expected & set(jobs)
              if jobs[name].get("status") != "completed"
              or jobs[name].get("conclusion") != "success"
          )
          if missing or bad:
              if missing:
                  print(f"missing required Validate jobs: {', '.join(missing)}", file=sys.stderr)
              if bad:
                  print(f"unsuccessful required Validate jobs: {', '.join(bad)}", file=sys.stderr)
              sys.exit(1)
          PY
            echo "Canonical main Validate workflow succeeded for $tag_sha: $run_url"
            exit 0
          done

          echo "::error::Timed out waiting for Validate workflow on main for $tag_sha"
          exit 1

  publish:
    runs-on: ubuntu-24.04
    needs:
      - validate
      - hacs
      - hassfest
      - main-validation
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Resolve release tag
        id: release-tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/check_release_tag.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Release validation gates
        run: python scripts/check_repo.py
      - name: Resolve reusable native agent
        id: reusable-agent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${C300X_DEVICE_SYSROOT:-}" ] \
            && [ -f "${C300X_DEVICE_SYSROOT}/lib/libc.so.6" ]; then
            echo "asset_source=build" >> "$GITHUB_OUTPUT"
            echo "reuse_args=" >> "$GITHUB_OUTPUT"
            echo "reused_from=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -F -x -v "$RELEASE_TAG" \
            | head -n 1 || true)"
          if [ -z "$previous_tag" ]; then
            echo "::error::C300X_DEVICE_SYSROOT is unavailable and no previous release tag exists for agent reuse"
            exit 1
          fi
          changed_inputs="$(git diff --name-only "$previous_tag..HEAD" -- \
            native_agent/src \
            native_agent/scripts \
            native_agent/VERSION \
            native_agent/Makefile \
            native_agent/config.example.json \
            device_qml \
            custom_components/bticino_c300x/device_agent/init \
            scripts/stage_device_agent_bundle.py)"
          if [ -n "$changed_inputs" ]; then
            printf '%s\n' "$changed_inputs"
            for attempt in $(seq 1 60); do
              rm -rf .release/reuse-current
              mkdir -p .release/reuse-current
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
                && gh release download "$RELEASE_TAG" \
                  --pattern ha-bticino-c300x.zip \
                  --pattern SHA256SUMS \
                  --pattern build-metadata.json \
                  --pattern sbom.spdx.json \
                  --dir .release/reuse-current \
                  --clobber; then
              CURRENT_RELEASE_TAG="$RELEASE_TAG" python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          
          metadata = json.loads(Path(".release/reuse-current/build-metadata.json").read_text())
          expected = {
              "release_tag": os.environ["CURRENT_RELEASE_TAG"],
              "git_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True,
              ).strip(),
              "native_agent_version": Path("native_agent/VERSION").read_text().strip(),
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  print(f"current release asset metadata mismatch for {key}", file=sys.stderr)
                  sys.exit(1)
          bundle = metadata.get("device_agent_bundle") or {}
          if bundle.get("agent_version") != expected["native_agent_version"]:
              print("current release asset agent version mismatch", file=sys.stderr)
              sys.exit(1)
          PY
              (
                cd .release/reuse-current
                sha256sum -c SHA256SUMS
              )
              mkdir -p .release
              cp .release/reuse-current/ha-bticino-c300x.zip "$RELEASE_ZIP"
              cp .release/reuse-current/SHA256SUMS "$RELEASE_SHA256SUMS"
              cp .release/reuse-current/build-metadata.json "$RELEASE_METADATA"
              cp .release/reuse-current/sbom.spdx.json "$RELEASE_SBOM"
              echo "asset_source=current-release" >> "$GITHUB_OUTPUT"
              echo "reuse_args=" >> "$GITHUB_OUTPUT"
              echo "reused_from=" >> "$GITHUB_OUTPUT"
              exit 0
              fi
              if [ "$attempt" -lt 60 ]; then
                echo "Waiting for same-tag release assets for $RELEASE_TAG ($attempt/60)"
                sleep 10
              fi
            done
            echo "::error::Native agent/bundle inputs changed since $previous_tag; C300X_DEVICE_SYSROOT or same-tag release assets built from this commit are required"
            exit 1
          fi
          mkdir -p .release/reuse
          gh release download "$previous_tag" \
            --pattern ha-bticino-c300x.zip \
            --dir .release/reuse \
            --clobber
          test -s .release/reuse/ha-bticino-c300x.zip
          echo "asset_source=build" >> "$GITHUB_OUTPUT"
          echo "reuse_args=--reuse-agent-from-release-zip .release/reuse/ha-bticino-c300x.zip" >> "$GITHUB_OUTPUT"
          echo "reused_from=$previous_tag" >> "$GITHUB_OUTPUT"
      - name: Build HACS release zip
        if: steps.reusable-agent.outputs.asset_source == 'build'
        run: scripts/build_hacs_release.py ${{ steps.reusable-agent.outputs.reuse_args }}
      - name: Generate release metadata
        if: steps.reusable-agent.outputs.asset_source == 'build'
        run: |
          scripts/write_release_assets.py \
            --zip "$RELEASE_ZIP" \
            --tag "${{ steps.release-tag.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --native-agent-reused-from "${{ steps.reusable-agent.outputs.reused_from }}" \
            --sha256sums "$RELEASE_SHA256SUMS" \
            --metadata "$RELEASE_METADATA" \
            --sbom "$RELEASE_SBOM"
      - name: Verify release assets
        run: |
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_SHA256SUMS"
          test -s "$RELEASE_METADATA"
          test -s "$RELEASE_SBOM"
          (cd .release && sha256sum -c SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ha-bticino-c300x-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256SUMS }}
            ${{ env.RELEASE_METADATA }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
      - name: Generate artifact attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
      - name: Generate SBOM attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
          sbom-path: ${{ env.RELEASE_SBOM }}
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          assets=(
            "$RELEASE_ZIP"
            "$RELEASE_SHA256SUMS"
            "$RELEASE_METADATA"
            "$RELEASE_SBOM"
          )
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
