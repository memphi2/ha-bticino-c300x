name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v2.1.0 or v2.1.0b1"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  RELEASE_ZIP: .release/ha-bticino-c300x.zip
  RELEASE_SHA256SUMS: .release/SHA256SUMS
  RELEASE_METADATA: .release/build-metadata.json
  RELEASE_SBOM: .release/sbom.spdx.json

jobs:
  main-validation:
    name: main validation gate
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.verified-main.outputs.commit }}
      evidence-digest: ${{ steps.verified-main.outputs.evidence-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Wait for canonical main validation
        id: verified-main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python scripts/verify_main_validation.py --tag "$RELEASE_TAG" \
            --wait-seconds 900 --output .release/validation-evidence.json

  publish:
    runs-on: ubuntu-26.04
    needs:
      - main-validation
    permissions:
      actions: read
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.main-validation.outputs.commit }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install release validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/check_release_tag.py "$RELEASE_TAG" --attestation-context
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify canonical validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          EVIDENCE_DIGEST: ${{ needs.main-validation.outputs.evidence-digest }}
        run: |
          test -n "$EVIDENCE_DIGEST"
          python scripts/verify_main_validation.py --tag "$RELEASE_TAG" \
            --expect-digest "$EVIDENCE_DIGEST" --output .release/validation-evidence.json
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libcurl4-openssl-dev pkg-config
      - name: Release validation gates
        run: python scripts/check_repo.py
      - name: Resolve reusable native agent
        id: reusable-agent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # This checked-in approval is independent of all downloaded metadata.
          python scripts/native_build_lock.py --check-inputs
          if [ -n "${C300X_DEVICE_SYSROOT:-}" ] \
            && [ -f "${C300X_DEVICE_SYSROOT}/lib/libc.so.6" ]; then
            echo "asset_source=build" >> "$GITHUB_OUTPUT"
            echo "reuse_args=" >> "$GITHUB_OUTPUT"
            echo "reused_from=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_tag="$(python scripts/release_version.py "$RELEASE_TAG")"
          mkdir -p .release/reuse
          # Prefer the locally built same-tag draft asset. An older asset is
          # usable only with the SAME current source/version/byte approval.
          for candidate in "$RELEASE_TAG" "$previous_tag"; do
            [ -n "$candidate" ] || continue
            rm -f .release/reuse/ha-bticino-c300x.zip
            if gh release download "$candidate" \
              --pattern ha-bticino-c300x.zip --dir .release/reuse --clobber \
              && python scripts/native_build_lock.py --zip .release/reuse/ha-bticino-c300x.zip; then
              echo "asset_source=build" >> "$GITHUB_OUTPUT"
              echo "reuse_args=--reuse-agent-from-release-zip .release/reuse/ha-bticino-c300x.zip" >> "$GITHUB_OUTPUT"
              echo "reused_from=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No release executable matches the reviewed native build lock; build locally and review its lock before release."
          exit 1
      - name: Build HACS release zip
        if: steps.reusable-agent.outputs.asset_source == 'build'
        run: scripts/build_hacs_release.py ${{ steps.reusable-agent.outputs.reuse_args }}
      - name: Bind packaged agent to selected build output
        run: |
          python scripts/check_release_contents.py "$RELEASE_ZIP" \
            --agent-binary native_agent/build/armhf/c300x-agent-native \
            --build-lock native_agent/build-lock.json
      - name: Generate release metadata
        if: steps.reusable-agent.outputs.asset_source == 'build'
        env:
          C300X_VALIDATION_EVIDENCE: .release/validation-evidence.json
          C300X_VALIDATION_EVIDENCE_SHA256: ${{ needs.main-validation.outputs.evidence-digest }}
        run: |
          scripts/write_release_assets.py \
            --zip "$RELEASE_ZIP" \
            --tag "${{ steps.release-tag.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --native-agent-reused-from "${{ steps.reusable-agent.outputs.reused_from }}" \
            --sha256sums "$RELEASE_SHA256SUMS" \
            --metadata "$RELEASE_METADATA" \
            --sbom "$RELEASE_SBOM"
      - name: Validate SPDX SBOM
        run: pyspdxtools -i "$RELEASE_SBOM"
      - name: Verify release assets
        run: |
          test -s "$RELEASE_ZIP"
          test -s "$RELEASE_SHA256SUMS"
          test -s "$RELEASE_METADATA"
          test -s "$RELEASE_SBOM"
          (cd .release && sha256sum -c SHA256SUMS)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ha-bticino-c300x-release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA256SUMS }}
            ${{ env.RELEASE_METADATA }}
            ${{ env.RELEASE_SBOM }}
          if-no-files-found: error
      - name: Generate artifact attestation
        id: provenance_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
      - name: Generate SBOM attestation
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.RELEASE_ZIP }}
          sbom-path: ${{ env.RELEASE_SBOM }}
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.release-tag.outputs.ref }}
          RELEASE_COMMIT: ${{ steps.release-tag.outputs.commit }}
        run: |
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "${{ steps.provenance_attestation.outputs.bundle-path }}" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
          gh attestation verify "$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "${{ steps.sbom_attestation.outputs.bundle-path }}" \
            --predicate-type "https://spdx.dev/Document/v2.3" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$RELEASE_REF" \
            --source-digest "$RELEASE_COMMIT"
      - name: Recheck canonical evidence before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
          EVIDENCE_DIGEST: ${{ needs.main-validation.outputs.evidence-digest }}
        run: |
          test -n "$EVIDENCE_DIGEST"
          python scripts/verify_main_validation.py --tag "$RELEASE_TAG" \
            --expect-digest "$EVIDENCE_DIGEST" --output .release/rechecked-validation-evidence.json
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python scripts/publish_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --directory .release \
            --finalize-transport-draft
