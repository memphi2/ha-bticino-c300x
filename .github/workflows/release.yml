name: Build HACS Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hacs-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install ARMHF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Build HACS release zip
        run: scripts/build_hacs_release.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ha-bticino-c300x
          path: .release/ha-bticino-c300x.zip
          if-no-files-found: error
