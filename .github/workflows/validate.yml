name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-ha
            python-version: "3.14"
            homeassistant: "2026.5.0"
            requirements-lock: requirements-dev-min-ha.txt
          - name: current-ha
            python-version: "3.14"
            homeassistant: "2026.9.0"
            requirements-lock: requirements-dev.txt
    name: validate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history with tags: the managed-blueprint digest table is
          # verified against real release content, and the native-agent version
          # gate compares against the previous release tag. On the default
          # shallow checkout both silently degrade -- the gate finds no tag and
          # passes without checking anything.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools
        run: |
          python -m pip install "homeassistant==${{ matrix.homeassistant }}"
          python -m pip install -r "${{ matrix.requirements-lock }}"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version

          expected = "${{ matrix.homeassistant }}"
          actual = version("homeassistant")
          if actual != expected:
              raise SystemExit(f"homeassistant lock mismatch: expected {expected}, got {actual}")
          PY
      - name: Install native agent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Validation gates
        run: python scripts/check_validate.py

  dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependabot configuration
        run: |
          test -f .github/dependabot.yml
          grep -F 'package-ecosystem: "github-actions"' .github/dependabot.yml
          grep -F 'package-ecosystem: "pip"' .github/dependabot.yml

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration uses zip_release; these checks need the release asset,
          # so branch/PR validation covers the remaining HACS repository gates.
          ignore: hacsjson integration_manifest

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
