name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-ha
            python-version: "3.14"
            requirements-ha: requirements/ha-min/requirements.txt
            requirements-lock: requirements-dev-min-ha.txt
          - name: current-ha
            python-version: "3.14"
            requirements-ha: requirements/ha-current/requirements.txt
            requirements-lock: requirements-dev.txt
    name: validate (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history with tags: the managed-blueprint digest table is
          # verified against real release content, and the native-agent version
          # gate compares against the previous release tag. On the default
          # shallow checkout both silently degrade -- the gate finds no tag and
          # passes without checking anything.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python validation tools
        run: |
          python -m pip install -r "${{ matrix.requirements-ha }}" -r "${{ matrix.requirements-lock }}"
          python -m pip check
      - name: Install native agent toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
      - name: Validation gates
        run: python scripts/check_validate.py

  dependabot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Dependabot configuration
        run: |
          python -m pip install -c requirements-dev.txt packaging PyYAML
          python scripts/check_dependency_updates.py

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration uses zip_release; these checks need the release asset,
          # so branch/PR validation covers the remaining HACS repository gates.
          ignore: hacsjson integration_manifest

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
