blueprint:
  name: BTicino Ring Call iOS phone alert
  description: Ring an iPhone for an answerable Ring Call of the door station. The notification can open the configured dashboard, answer the call, and hang up.
  domain: automation
  source_url: https://github.com/memphi2/ha-bticino-c300x/blob/main/blueprints/automation/bticino_c300x/doorbell_call_ios.yaml
  input:
    doorbell_event:
      name: Doorbell
      description: The doorbell event of the outdoor unit to react to. For the fastest reaction pick the station's ring event instead; it fires at once, without the outdoor unit's name.
      selector:
        entity:
          filter:
            - integration: bticino_c300x
              domain: event
              device_class: doorbell
    notify_service:
      name: iOS notify service
      description: Companion App notify service, for example notify.mobile_app_your_iphone.
      selector:
        text:
    dashboard_path:
      name: Dashboard path
      description: Dashboard path opened when the notification is tapped.
      default: /lovelace/c300x
      selector:
        text:
    title:
      name: Title
      default: Doorbell
      selector:
        text:
    message:
      name: Message
      default: Open Home Assistant or answer from this notification.
      selector:
        text:
    answer_title:
      name: Answer button
      default: Answer
      selector:
        text:
    hangup_title:
      name: Hang up button
      default: Hang up
      selector:
        text:
    open_title:
      name: Open dashboard button
      default: Open
      selector:
        text:
    critical_sound:
      name: Ring sound
      description: iOS critical notification sound name. Use default unless you configured a custom sound in the Companion App.
      default: default
      selector:
        text:
    critical_volume:
      name: Ring volume
      description: iOS critical notification volume.
      default: 1
      selector:
        number:
          min: 0
          max: 1
          step: 0.1
          mode: slider
    notification_timeout_seconds:
      name: Ring notification timeout
      description: Seconds to keep the answerable notification active.
      default: 60
      selector:
        number:
          min: 10
          max: 300
          step: 5
          mode: box
    active_call_timeout_seconds:
      name: Active-call timeout
      description: Seconds to keep listening for the Hang Up action after Answer.
      default: 180
      selector:
        number:
          min: 30
          max: 900
          step: 10
          mode: box

mode: restart

trigger:
  - platform: state
    entity_id: !input doorbell_event
    not_from:
      - unavailable
    not_to:
      - unavailable
      - unknown

variables:
  doorbell_event: !input doorbell_event
  # An outdoor unit's device hangs below the station, which has the sensors.
  doorbell_device: "{{ device_id(doorbell_event) }}"
  c300x_device: "{{ device_attr(doorbell_device, 'via_device_id') or doorbell_device }}"
  c300x_entities: "{{ device_entities(c300x_device) | list }}"
  call_id: "{{ trigger.to_state.attributes.call_id | default('', true) if trigger.to_state else '' }}"
  forwarding_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% set options = state_attr(entity_id, 'options') or [] %}
      {% if entity_id.startswith('select.')
            and 'homeassistant' in options and 'blocked' in options %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  media_readiness_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% if entity_id.startswith('sensor.')
            and state_attr(entity_id, 'agent_reachable') is not none
            and state_attr(entity_id, 'media_user_ok') is not none
            and state_attr(entity_id, 'ring_call_supported') is not none %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  camera_entity: "{{ state_attr(doorbell_event, 'camera_entity_id') or '' }}"
  entry_id: "{{ config_entry_id(doorbell_event) or '' }}"
  # The Door events of this station's outdoor units, and their last event
  # times when the ring came in.
  door_events: >-
    {% set ns = namespace(entities=[]) %}
    {% for entity_id in integration_entities('bticino_c300x') %}
      {% if entity_id.startswith('event.') and config_entry_id(entity_id) == entry_id
            and 'opened' in (state_attr(entity_id, 'event_types') or []) %}
        {% set ns.entities = ns.entities + [entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.entities }}
  door_states: "{{ door_events | map('states') | list }}"
  dashboard_path: !input dashboard_path
  title: !input title
  message: !input message
  answer_title: !input answer_title
  hangup_title: !input hangup_title
  open_title: !input open_title
  critical_sound: !input critical_sound
  critical_volume: !input critical_volume
  notification_timeout_seconds: !input notification_timeout_seconds
  active_call_timeout_seconds: !input active_call_timeout_seconds
  action_scope: "{{ (this.entity_id | default('automation.c300x_ios_ring_call', true)) | replace('.', '_') | upper }}"
  ring_tag: "{{ 'c300x_ios_ring_call_' ~ action_scope | lower }}"
  active_tag: "{{ 'c300x_ios_ring_call_active_' ~ action_scope | lower }}"
  answer_dashboard_path: >-
    {% set parts = dashboard_path.split('#', 1) %}
    {% set base = parts[0] %}
    {% set fragment = '#' ~ parts[1] if parts | length > 1 else '' %}
    {% set launch_target = camera_entity %}
    {{ base ~ ('&' if '?' in base else '?') ~ 'c300x_ring_answer=' ~ (launch_target | urlencode) ~ fragment }}

condition:
  - condition: template
    value_template: >-
      {{ entry_id not in ['', none] and call_id not in ['', none] }}
  - condition: template
    value_template: >-
      {{ state_attr(forwarding_entity, 'state') == 'homeassistant' }}
  - condition: template
    value_template: "{{ states(media_readiness_entity) in ['ready', 'warning'] }}"

action:
  # The script context is available here, after automation variables render.
  - variables:
      answer_action: "{{ 'C300X_IOS_RING_ANSWER_' ~ action_scope ~ '_' ~ context.id }}"
      hangup_action: "{{ 'C300X_IOS_RING_HANGUP_' ~ action_scope ~ '_' ~ context.id }}"
  - service: !input notify_service
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      data:
        url: "{{ dashboard_path }}"
        clickAction: "{{ dashboard_path }}"
        entity_id: "{{ camera_entity }}"
        tag: "{{ ring_tag }}"
        group: c300x
        push:
          sound:
            name: "{{ critical_sound }}"
            critical: 1
            volume: "{{ critical_volume | float(1) }}"
          interruption-level: critical
          category: camera
        actions:
          - action: "{{ answer_action }}"
            title: "{{ answer_title }}"
            uri: "{{ answer_dashboard_path }}"
            activationMode: foreground
            authenticationRequired: false
          - action: "{{ hangup_action }}"
            title: "{{ hangup_title }}"
            activationMode: background
            authenticationRequired: false
            destructive: true
          - action: URI
            title: "{{ open_title }}"
            uri: "{{ dashboard_path }}"
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ answer_action }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ hangup_action }}"
      # Someone let the visitor in -- from the phone, the station, the app or
      # any other lock control: a Door event of this station fires. A Door
      # entity that comes back after a reload keeps its time and is no opening.
      - id: door_unlock
        platform: template
        value_template: >-
          {% set ns = namespace(opened=false) %}
          {% for entity_id in door_events %}
            {% set state = states(entity_id) %}
            {% if state not in ['unknown', 'unavailable'] and state != door_states[loop.index0] %}
              {% set ns.opened = true %}
            {% endif %}
          {% endfor %}
          {{ ns.opened }}
    timeout: "{{ notification_timeout_seconds | int(60) }}"
    continue_on_timeout: true
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ wait.trigger is not none and wait.trigger.event is defined
                 and wait.trigger.event.data.action == answer_action }}
        sequence:
          - service: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ ring_tag }}"
          - service: bticino_c300x.answer_call
            target:
              entity_id: "{{ doorbell_event }}"
            data:
              call_id: "{{ call_id }}"
          - service: !input notify_service
            data:
              title: "{{ title }}"
              message: "Call active"
              data:
                url: "{{ dashboard_path }}"
                clickAction: "{{ dashboard_path }}"
                tag: "{{ active_tag }}"
                group: c300x
                push:
                  sound:
                    name: none
                  interruption-level: active
                actions:
                  - action: "{{ hangup_action }}"
                    title: "{{ hangup_title }}"
                    activationMode: background
                    authenticationRequired: false
                    destructive: true
                  - action: URI
                    title: "{{ open_title }}"
                    uri: "{{ dashboard_path }}"
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ hangup_action }}"
            timeout: "{{ active_call_timeout_seconds | int(180) }}"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ wait.trigger is not none and wait.trigger.event is defined
                     and wait.trigger.event.data.action == hangup_action }}
            then:
              # The call may have ended meanwhile; nothing is left to hang up then.
              - service: bticino_c300x.hangup_call
                continue_on_error: true
                target:
                  entity_id: "{{ doorbell_event }}"
                data:
                  call_id: "{{ call_id }}"
          - service: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ active_tag }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ wait.trigger is not none and wait.trigger.event is defined
                 and wait.trigger.event.data.action == hangup_action }}
        sequence:
          # The call may have ended meanwhile; nothing is left to hang up then.
          - service: bticino_c300x.hangup_call
            continue_on_error: true
            target:
              entity_id: "{{ doorbell_event }}"
            data:
              call_id: "{{ call_id }}"
          - service: !input notify_service
            data:
              message: clear_notification
              data:
                tag: "{{ ring_tag }}"
    # Ring timeout, or the door was opened before anyone reacted: clear the
    # alert. On a door unlock the Ring Call itself is deliberately left alone --
    # opening the door does not decide whether someone still wants to talk to
    # the visitor.
    default:
      - service: !input notify_service
        data:
          message: clear_notification
          data:
            tag: "{{ ring_tag }}"
