blueprint:
  name: BTicino Doorbell notification
  description: Send a notification or run another action when a visitor rings at an outdoor unit. The variables call_id, unit_name and camera_entity are available to the action. This blueprint does not answer a call.
  domain: automation
  source_url: https://github.com/memphi2/ha-bticino-c300x/blob/main/blueprints/automation/bticino_c300x/doorbell_notification.yaml
  input:
    doorbell_event:
      name: Doorbell
      description: The doorbell event of the outdoor unit to react to. For the fastest reaction pick the station's ring event instead; it fires at once, without the outdoor unit's name.
      selector:
        entity:
          filter:
            - integration: bticino_c300x
              domain: event
              device_class: doorbell
    dashboard_path:
      name: Dashboard path
      description: Dashboard path to open from the notification action.
      default: /lovelace/c300x
      selector:
        text:
    notify_action:
      name: Notification action
      description: Action to run when the doorbell rings. Use this for notify.mobile_app_* or another notification script.
      selector:
        action:

mode: restart

trigger:
  - platform: state
    entity_id: !input doorbell_event
    not_from:
      - unavailable
    not_to:
      - unavailable
      - unknown

variables:
  doorbell_event: !input doorbell_event
  call_id: "{{ trigger.to_state.attributes.call_id | default('', true) }}"
  entry_id: "{{ config_entry_id(doorbell_event) or '' }}"
  camera_entity: "{{ state_attr(doorbell_event, 'camera_entity_id') or '' }}"
  unit_name: "{{ trigger.to_state.attributes.unit_name | default('', true) }}"
  dashboard_path: !input dashboard_path

condition:
  - condition: template
    value_template: >-
      {{ entry_id not in ['', none] and call_id not in ['', none] }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "true"
        sequence: !input notify_action
