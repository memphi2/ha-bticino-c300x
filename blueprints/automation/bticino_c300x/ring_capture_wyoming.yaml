blueprint:
  name: BTicino Ring capture and Wyoming transcription
  description: Capture a ring clip, then transcribe that exact recording with a local Wyoming Whisper service.
  domain: automation
  source_url: https://github.com/memphi2/ha-bticino-c300x/blob/main/blueprints/automation/bticino_c300x/ring_capture_wyoming.yaml
  input:
    doorbell_event:
      name: Doorbell
      description: The doorbell event of the outdoor unit to react to. For the fastest reaction pick the station's ring event instead; it fires at once, without the outdoor unit's name.
      selector:
        entity:
          filter:
            - integration: bticino_c300x
              domain: event
              device_class: doorbell
    wyoming_host:
      name: Wyoming host
      description: Hostname or IP address of the Wyoming Whisper service.
      selector:
        text:
    wyoming_port:
      name: Wyoming port
      default: 10300
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    language:
      name: Language hint
      description: Optional Whisper language hint, for example de or en.
      default: ""
      selector:
        text:
    expected_phrase:
      name: Expected phrase
      description: Optional exact phrase stored in the transcription result for later decision.
      default: ""
      selector:
        text:
    duration_seconds:
      name: Duration
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: slider
    capture_file_dir:
      name: Capture file directory
      default: /config/c300x
      selector:
        text:
    result_path:
      name: Result path
      description: Leave empty for an isolated result beside the recording. A custom path must not be shared with another automation.
      default: ""
      selector:
        text:

mode: single
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input doorbell_event
    not_from:
      - unavailable
    not_to:
      - unavailable
      - unknown

variables:
  doorbell_event: !input doorbell_event
  # An outdoor unit's device hangs below the station, which has the sensors.
  doorbell_device: "{{ device_id(doorbell_event) }}"
  c300x_device: "{{ device_attr(doorbell_device, 'via_device_id') or doorbell_device }}"
  c300x_entities: "{{ device_entities(c300x_device) | list }}"
  call_id: "{{ trigger.to_state.attributes.call_id | default('', true) if trigger.to_state else '' }}"
  media_readiness_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% if entity_id.startswith('sensor.')
            and state_attr(entity_id, 'agent_reachable') is not none
            and state_attr(entity_id, 'media_user_ok') is not none
            and state_attr(entity_id, 'ring_call_supported') is not none %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  entry_id: "{{ config_entry_id(doorbell_event) or '' }}"
  wyoming_host: !input wyoming_host
  language: !input language
  expected_phrase: !input expected_phrase
  capture_file_dir: !input capture_file_dir
  result_path: !input result_path

condition:
  - condition: template
    value_template: >-
      {{ entry_id not in ['', none] and call_id not in ['', none] }}
  - condition: template
    value_template: "{{ states(media_readiness_entity) in ['ready', 'warning'] }}"

action:
  - service: bticino_c300x.capture_doorbell_call
    target:
      entity_id: "{{ doorbell_event }}"
    data:
      duration_seconds: !input duration_seconds
      include_audio: true
      wav_output_dir: "{{ capture_file_dir }}"
    response_variable: capture
  - service: bticino_c300x.run_ring_wyoming_analysis
    data:
      wyoming_host: "{{ wyoming_host }}"
      wyoming_port: !input wyoming_port
      capture_path: "{{ capture.metadata_path }}"
      wav_path: "{{ capture.raw_wav_path }}"
      result_path: "{{ result_path }}"
      language: "{{ language }}"
      expected_phrase: "{{ expected_phrase }}"
    response_variable: analysis
