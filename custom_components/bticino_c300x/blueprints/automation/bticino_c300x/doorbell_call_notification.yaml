blueprint:
  name: C300X Doorbell call notification
  description: Notify only when a C300X Ring Call can be answered from Home Assistant.
  domain: automation
  source_url: https://github.com/memphi2/ha-bticino-c300x/blob/main/blueprints/automation/bticino_c300x/doorbell_call_notification.yaml
  input:
    c300x_device:
      name: C300X device
      description: Select the C300X device. The blueprint derives the camera, forwarding select and media-readiness sensor from this device.
      selector:
        device:
          integration: bticino_c300x
    dashboard_path:
      name: Dashboard path
      description: Dashboard path opened by the Answer action.
      default: /lovelace/c300x
      selector:
        text:
    notify_action:
      name: Notification action
      description: Action to run when the Ring Call should be shown. Use this for notify.mobile_app_* or another notification script.
      selector:
        action:

mode: restart

trigger:
  - platform: event
    event_type: bticino_c300x_agent_event_received
    event_data:
      event_key: doorbell_pressed

variables:
  c300x_device: !input c300x_device
  c300x_entities: "{{ device_entities(c300x_device) | list }}"
  entry_id: "{{ trigger.event.data.entry_id | default('', true) }}"
  event_camera_entity: "{{ trigger.event.data.camera_entity_id | default('', true) }}"
  forwarding_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% set options = state_attr(entity_id, 'options') or [] %}
      {% if entity_id.startswith('select.')
            and 'Home Assistant' in options
            and 'Blocked' in options %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  media_readiness_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% if entity_id.startswith('sensor.')
            and state_attr(entity_id, 'agent_reachable') is not none
            and state_attr(entity_id, 'media_user_ok') is not none
            and state_attr(entity_id, 'ring_call_supported') is not none %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  camera_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% if not ns.entity and entity_id.startswith('camera.') %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  dashboard_path: !input dashboard_path

condition:
  - condition: template
    value_template: >-
      {{ entry_id and event_camera_entity in c300x_entities }}
  - condition: template
    value_template: >-
      {{ states(forwarding_entity) == 'Home Assistant'
         or states(forwarding_entity) == 'homeassistant'
         or state_attr(forwarding_entity, 'state') == 'homeassistant'
         or state_attr(forwarding_entity, 'mode') == 'homeassistant' }}
  - condition: template
    value_template: "{{ states(media_readiness_entity) in ['ready', 'warning'] }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "true"
        sequence: !input notify_action
