blueprint:
  name: C300X Doorbell notification
  description: Send a notification or run another action when the C300X doorbell rings. This blueprint does not answer a call.
  domain: automation
  source_url: https://github.com/memphi2/ha-bticino-c300x/blob/main/blueprints/automation/bticino_c300x/doorbell_notification.yaml
  input:
    c300x_device:
      name: C300X device
      description: Select the C300X device. The blueprint derives the camera entity from this device.
      selector:
        device:
          integration: bticino_c300x
    entry_id:
      name: Entry ID
      description: Optional C300X config entry ID. Leave empty when there is only one C300X entry.
      default: ""
      selector:
        text:
    dashboard_path:
      name: Dashboard path
      description: Dashboard path to open from the notification action.
      default: /lovelace/c300x
      selector:
        text:
    notify_action:
      name: Notification action
      description: Action to run when the doorbell rings. Use this for notify.mobile_app_* or another notification script.
      selector:
        action:

mode: restart

trigger:
  - platform: event
    event_type: bticino_c300x_agent_event_received
    event_data:
      event_key: doorbell_pressed

variables:
  c300x_device: !input c300x_device
  entry_id: !input entry_id
  c300x_entities: "{{ device_entities(c300x_device) | list }}"
  camera_entity: >-
    {% set ns = namespace(entity='') %}
    {% for entity_id in c300x_entities %}
      {% if not ns.entity and entity_id.startswith('camera.') %}
        {% set ns.entity = entity_id %}
      {% endif %}
    {% endfor %}
    {{ ns.entity }}
  dashboard_path: !input dashboard_path

condition:
  - condition: template
    value_template: >-
      {{ not entry_id or trigger.event.data.entry_id == entry_id }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "true"
        sequence: !input notify_action
