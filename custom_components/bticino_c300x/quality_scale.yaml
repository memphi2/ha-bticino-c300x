# Local self-assessment, reviewed 2026-11-23; not an official HA tier.
# Per-rule evidence and open work: docs/dev/quality-scale.md.
rules:
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Device state uses push and non-polling entities. Subscription renewal/recovery and HA calendar/statistics refresh timers are not periodic device-state polling.
  brands:
    status: todo
    comment: Prepare Home Assistant Brands assets before a core submission.
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: Existing flow tests are not a current 100 percent coverage and error-recovery report for config_flow.py and its extracted helpers; rerun after reviews.
  config-flow: done
  dependency-transparency:
    status: todo
    comment: Optional installer dependency asyncssh is pinned and disclosed, but its exact release tag and public build/publish CI evidence are not recorded in this audit.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: No integration-specific condition platform or conditions.yaml is provided; generic HA state/template conditions are not custom conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: Advanced maintenance separates HA-entry deletion, Marketplace/HACS/manual package removal and explicit device-agent uninstall, with retained media/configuration/backup guidance; Quickstart links it.
  docs-triggers:
    status: exempt
    comment: No integration-specific trigger platform or triggers.yaml is provided; event entities and blueprints use the standard HA event/state triggers.
  entity-event-setup:
    status: done
    comment: Push listeners are registered from entity lifecycle callbacks.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Shared read-only credential validation covers manual and discovered setup, installer skip, final creation, reconfigure and connection options. Focused auth-flow and bootstrap regressions pass on HA 2026.10.0 and 2026.11.1; SSH credentials remain ephemeral.
  test-before-setup:
    status: todo
    comment: Authentication rejection now raises ConfigEntryAuthFailed and offline recovery can start reauth. Existing entries deliberately still load unavailable while offline rather than raising ConfigEntryNotReady; this custom-integration policy remains distinct from the strict HA setup contract. Focused runtime tests cover both paths.
  unique-config-entry: done

  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: Feature reference describes options and links the four ICE choices, their default and exact filtering exceptions; focused documentation tests compare the policy table to the code.
  docs-installation-parameters:
    status: done
    comment: Quickstart and feature reference cover setup/SSH inputs and link the ICE selector's four values, default and behavior; no address or token is required for that selector.
  entity-unavailable:
    status: done
    comment: C300XEntity observes shared connection availability after reconnect grace; command-read failures also mark entities unavailable. Diagnostic connection sensors intentionally remain readable.
  integration-owner:
    status: done
    comment: manifest.json lists @memphi2, the maintainer of the linked public source repository.
  log-when-unavailable:
    status: done
    comment: Event registration warns once per outage and logs one recovery, using shared registration state across rediscovery. Focused caplog and teardown tests cover repeated failures, incoming callbacks, recovery, another outage and cancellation on HA 2026.10.0 and 2026.11.1.
  parallel-updates:
    status: done
    comment: Entities are non-polling and command concurrency is bounded where outbound calls exist.
  reauthentication-flow:
    status: done
    comment: Entry-bound reauth validates access and supplied maintenance keys, preserves identity and unrelated settings, clears stale key overrides and reloads once. Startup and registration rejection trigger HA reauth; focused tests include the installed HA ConfigEntry deduplication API on 2026.10.0 and 2026.11.1. SSH bootstrap remains separate.
  test-coverage:
    status: todo
    comment: Silver requires more than 95 percent coverage in every integration module. The local aggregate 95 percent floor and historical reports do not prove this for the current source.

  devices:
    status: done
    comment: All entities inherit the configured C300X DeviceInfo for one display/agent pair.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: An entry saved with an IPv4 address follows a newly announced IPv4 address only when the saved address no longer proves the identity and the new one does; a proof answers a fresh nonce, sent without credentials, with an HMAC-SHA256 keyed by the saved access token over the identity and the address it was reached on (discovery_move.py; tests/test_config_flow_discovery_move.py). Host names are never replaced.
  discovery:
    status: done
    comment: The native agent advertises a minimal mDNS service while HA is not using it, announces again once HA has made no authenticated API request for 15 minutes, and reopens its mDNS socket when its IPv4 address changes.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration models one configured display/agent pair.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Transient diagnostic event-state helpers are disabled by default; the event entity is the primary automation surface.
  entity-translations: done
  exception-translations:
    status: todo
    comment: Shared translated exceptions exist, but services.py notification validation and ring_ai.py still raise user-visible errors with plain English text.
  icon-translations:
    status: todo
    comment: icons.json exists, but camera.py still hardcodes its static icon and activation buttons set icons in Python; finish migration or document a rule-supported exception.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Repairs are created for invalid action maps, missing configured alarm entities, and empty agent capabilities.
  stale-devices:
    status: exempt
    comment: Each config entry owns one physical C300X device; removing the entry removes that device. No separately discovered child devices can become stale.

  async-dependency:
    status: todo
    comment: Agent HTTP uses async aiohttp and SSH uses AsyncSSH, but the installer runs a synchronous facade in asyncio.to_thread with its own asyncio.Runner. Conformance to the HA-event-loop requirement for this optional path still needs resolution.
  inject-websession:
    status: done
    comment: Device-agent HTTP calls use Home Assistant's shared aiohttp client session.
  strict-typing:
    status: todo
    comment: The strict target list is substantial but omits runtime_manager.py and several API/helper modules, which are followed silently. Full-module strict coverage and a current final pass remain unproven.
