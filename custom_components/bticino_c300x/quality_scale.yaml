rules:
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The HA side is webhook/local-push based; entities and dashboard do not use periodic polling.
  brands:
    status: todo
    comment: Prepare Home Assistant Brands assets before a core submission.
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: Add HA pytest coverage once Home Assistant test dependencies are installed.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: Push listeners are registered from entity lifecycle callbacks.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: The integration creates an inbound webhook and has no device endpoint to test during config.
  test-before-setup: done
  unique-config-entry: done

  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Command entities mark themselves unavailable when the agent read fails; event-derived read entities use push state.
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: HA does not maintain an outbound connection to the agent.
  parallel-updates:
    status: done
    comment: Entities are non-polling and command concurrency is bounded where outbound calls exist.
  reauthentication-flow:
    status: exempt
    comment: The webhook shared secret is generated by HA and can be rotated by reconfiguring the entry.
  test-coverage:
    status: todo
    comment: Target more than 95 percent once HA test harness is in place.

  devices:
    status: done
    comment: All entities inherit the configured C300X DeviceInfo for one display/agent pair.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: Zeroconf setup updates matching entries with the advertised agent host and port.
  discovery:
    status: done
    comment: The native agent can advertise a minimal mDNS service only until HA registers a subscription or display bridge.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration models one configured display/agent pair.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Transient diagnostic event-state helpers are disabled by default; the event entity is the primary automation surface.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Repairs are created for invalid action maps, missing configured alarm entities, and empty agent capabilities.
  stale-devices:
    status: exempt
    comment: Dynamic device removal does not apply yet.

  async-dependency:
    status: done
    comment: The aiortc media dependency is async-native and isolated to optional WebRTC camera setup.
  inject-websession:
    status: done
    comment: Device-agent HTTP calls use Home Assistant's shared aiohttp client session.
  strict-typing:
    status: todo
    comment: Add pyright/mypy coverage and keep all modules fully annotated.
