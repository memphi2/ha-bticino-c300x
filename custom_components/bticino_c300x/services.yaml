show_display_notification:
  name: Show display notification
  description: Create or replace a temporary native-display notification. Messages are cleared on HA restart or integration reload; this does not wake the display.
  target:
    entity:
      integration: bticino_c300x
  fields:
    notification_id:
      name: Notification ID
      required: true
      selector:
        text:
    title:
      name: Title
      required: true
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    icon:
      name: Symbol
      default: info
      selector:
        select:
          options: [info, warning, calendar]
    priority:
      name: Priority
      default: normal
      selector:
        select:
          options: [normal, important, urgent]
    expires_in:
      name: Expires after
      default: 3600
      selector:
        number:
          min: 1
          max: 604800
          mode: box
          unit_of_measurement: s
    actions:
      name: Actions
      description: At most two configured action_id and label pairs. Only existing allowlisted actions can be run.
      default: []
      selector:
        object:

dismiss_display_notification:
  name: Dismiss display notification
  description: Remove a notification by its stable ID. This does not resolve the underlying physical condition.
  target:
    entity:
      integration: bticino_c300x
  fields:
    notification_id:
      name: Notification ID
      required: true
      selector:
        text:

run_action:
  name: Run action
  description: Run one configured action by its allowlisted action id.
  target:
    entity:
      integration: bticino_c300x
  fields:
    action_id:
      name: Action ID
      description: Configured action id to run.
      required: true
      selector:
        text:

alarm_command:
  name: Send alarm command
  description: Send an alarm command to the configured alarm control panel entity.
  target:
    entity:
      integration: bticino_c300x
  fields:
    command:
      name: Command
      description: Alarm command to execute.
      required: true
      selector:
        select:
          options:
            - arm_away
            - arm_home
            - arm_night
            - arm_vacation
            - disarm
    code:
      name: Code
      description: Optional alarm code. The integration never stores this value.
      required: false
      selector:
        text:
          type: password
    force:
      name: Bypass open sensors
      description: Force arming through Alarmo when open sensors block the selected arm mode.
      required: false
      default: false
      selector:
        boolean:

camera_picture:
  name: Adjust camera picture
  description: Read all three live picture settings, or supply a control and a value (0 to 100% in steps of 10) to change one. Requires the updated device agent and an active Ring Call video or on-demand video with verified source values and ranges. Saved media is unchanged.
  target:
    entity:
      integration: bticino_c300x
  fields:
    control:
      selector:
        select:
          options: [brightness, contrast, saturation]
    value:
      selector:
        number:
          min: 0
          max: 100
          step: 10
          unit_of_measurement: "%"

activate_doorbell_video:
  name: Activate doorbell video
  description: Start or renew the doorbell video session through the local device agent. Use this from automations to pre-warm the camera when the doorbell rings.
  target:
    entity:
      integration: bticino_c300x
  fields:
    audio:
      name: Enable audio
      description: Request the station audio path together with video. Required for browser or Home Assistant mobile frontend talkback.
      required: false
      default: true
      selector:
        boolean:

answer_call:
  name: Answer call
  description: Answer a call at the station through the local device agent. Without a call ID it answers the current call. Media playback still needs a browser, recorder or other media consumer.
  target:
    entity:
      integration: bticino_c300x
  fields:
    call_id:
      name: Call ID
      description: The call to answer, from the call_id attribute of a ring event or call sensor. Fails when that call is no longer current.
      required: false
      selector:
        text:

hangup_call:
  name: Hang up call
  description: Hang up a call at the station through the local device agent. Without a call ID it hangs up the current call.
  target:
    entity:
      integration: bticino_c300x
  fields:
    call_id:
      name: Call ID
      description: The call to hang up, from the call_id attribute of a ring event or call sensor. Fails when that call is no longer current.
      required: false
      selector:
        text:

capture_doorbell_call:
  name: Capture doorbell video
  description: Record a short MP4 on Home Assistant. Ring mode requires an incoming doorbell call; on-demand mode records without ringing when media is idle. The MP4 defaults to /media/c300x/; optional WAV and JPEG files default to /config/c300x/.
  target:
    entity:
      integration: bticino_c300x
  fields:
    capture_mode:
      name: Capture mode
      description: Ring records an incoming call. On-demand starts a live recording without ringing and requires no other active camera or call.
      required: false
      default: ring
      selector:
        select:
          options:
            - ring
            - on_demand
          translation_key: capture_mode
    output_path:
      name: Output path
      description: Absolute MP4 path below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to a unique timestamped file below /media/c300x/. Concurrent writes to the same explicit path are rejected.
      required: false
      selector:
        text:
    duration_seconds:
      name: Duration
      description: Capture duration in seconds.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: slider
    include_audio:
      name: Include audio
      description: Include the station audio track when available.
      required: false
      default: true
      selector:
        boolean:
    wav_output_dir:
      name: Capture file directory
      description: Base directory below /media/c300x/, /config/c300x/, or /config/www/c300x/. Each capture has isolated WAV, frames and metadata below captures/<capture_id>/. Defaults to /config/c300x/. Latest paths remain compatibility pointers; use response_variable for exact paths.
      required: false
      selector:
        text:
    announcement_path:
      name: Announcement path
      description: Optional HA-local audio file below /media/c300x/, /config/c300x/, or /config/www/c300x/ to play through the station talkback while capturing. Available only in ring mode.
      required: false
      selector:
        text:

run_ring_wyoming_analysis:
  name: Transcribe ring audio with Wyoming Whisper
  description: Transcribe an existing ring raw WAV file with a local Wyoming Whisper service and write a JSON result. Defaults to /config/c300x/latest.capture.json and its latest.raw.wav; without capture metadata it falls back to the newest *.raw.wav directly below /config/c300x/.
  fields:
    wyoming_host:
      name: Wyoming host
      description: Hostname or IP address of the Wyoming Whisper service, for example core-whisper.
      required: true
      selector:
        text:
    wyoming_port:
      name: Wyoming port
      description: Wyoming Whisper TCP port.
      required: false
      default: 10300
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    capture_path:
      name: Capture metadata path
      description: Optional capture metadata JSON below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to /config/c300x/latest.capture.json when present.
      required: false
      selector:
        text:
    wav_path:
      name: WAV path
      description: Optional mono WAV path below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to the capture metadata raw WAV, normally /config/c300x/latest.raw.wav.
      required: false
      selector:
        text:
    result_path:
      name: Result path
      description: Optional JSON path below /media/c300x/, /config/c300x/, or /config/www/c300x/. Empty selects analysis/result.json beside the capture metadata, or /config/c300x/analysis/result.json for standalone WAV input. Do not share custom paths between devices.
      required: false
      selector:
        text:
    language:
      name: Language
      description: Optional language hint for Whisper, for example de or en.
      required: false
      selector:
        text:
    expected_phrase:
      name: Expected phrase
      description: Optional phrase to compare exactly against the transcript.
      required: false
      selector:
        text:

evaluate_ring_analysis:
  name: Evaluate ring analysis
  description: Evaluate a local ring transcription JSON result and optionally open the door only on a strict phrase match. This service does not run AI itself.
  target:
    entity:
      integration: bticino_c300x
  fields:
    result_path:
      name: Result path
      description: JSON result path below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to /config/c300x/analysis/result.json.
      required: false
      selector:
        text:
    decision_path:
      name: Decision path
      description: JSON decision path below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to /config/c300x/analysis/decision.json.
      required: false
      selector:
        text:
    capture_path:
      name: Capture metadata path
      description: Optional capture metadata JSON below /media/c300x/, /config/c300x/, or /config/www/c300x/. Defaults to the capture_path recorded in the result JSON.
      required: false
      selector:
        text:
    expected_phrase:
      name: Expected phrase
      description: Exact spoken phrase to match when the result JSON does not provide phrase_match.
      required: false
      selector:
        text:
    unlock_on_match:
      name: Unlock on match
      description: Open the door only when the phrase matches, and only the door of the outdoor unit that rang in the recording; a target of another outdoor unit is refused. Defaults to false.
      required: false
      default: false
      selector:
        boolean:

start_home_call:
  name: Start home call
  description: Start a local audio Home Call to the station through the local device agent.
  target:
    entity:
      integration: bticino_c300x
  fields:
    duration_seconds:
      name: Duration seconds
      description: Optional maximum call duration. Set 0 or leave empty to keep the call active until stopped or ended remotely.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          mode: box

stop_home_call:
  name: Stop home call
  description: Stop the active local Home Call through the local device agent.
  target:
    entity:
      integration: bticino_c300x

play_latest_video_message:
  name: Play latest video message
  description: Play the latest stored answering-machine video message on a media player.
  target:
    entity:
      integration: bticino_c300x
  fields:
    media_player_entity_id:
      name: Media player
      description: Media player entity that should play the latest video message.
      required: true
      selector:
        entity:
          domain: media_player

play_latest_voice_memo:
  name: Play latest voice memo
  description: Play the latest stored manual voice memo on a media player.
  target:
    entity:
      integration: bticino_c300x
  fields:
    media_player_entity_id:
      name: Media player
      description: Media player entity that should play the latest voice memo.
      required: true
      selector:
        entity:
          domain: media_player

write_text_memo:
  name: Write text memo
  description: Create a local manual text memo on the station. The memo is written only when this service is called.
  target:
    entity:
      integration: bticino_c300x
  fields:
    text:
      name: Text
      description: Memo text to store on the station. Maximum 512 UTF-8 bytes.
      required: true
      selector:
        text:
          multiline: true
    read:
      name: Mark as read
      description: Store the memo as already read. Leave disabled for a normal unread memo.
      required: false
      default: false
      selector:
        boolean:
