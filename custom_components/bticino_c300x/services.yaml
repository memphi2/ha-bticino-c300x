run_action:
  name: Run C300X action
  description: Run one configured C300X action by its allowlisted action id.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    action_id:
      name: Action ID
      description: Configured action id to run.
      required: true
      selector:
        text:

run_device_activation:
  name: Run C300X device activation
  description: Run one configured original C300X Quick Action or activation through the local device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    activation_id:
      name: Activation ID
      description: Configured C300X activation id reported by the device agent.
      required: true
      selector:
        text:

alarm_command:
  name: Send C300X alarm command
  description: Send an alarm command to the configured alarm control panel entity.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    command:
      name: Command
      description: Alarm command to execute.
      required: true
      selector:
        select:
          options:
            - arm_away
            - arm_home
            - arm_night
            - arm_vacation
            - disarm
    code:
      name: Code
      description: Optional alarm code. The integration never stores this value.
      required: false
      selector:
        text:
          type: password
    force:
      name: Bypass open sensors
      description: Force arming through Alarmo when open sensors block the selected arm mode.
      required: false
      default: false
      selector:
        boolean:

stair_light:
  name: Activate C300X stair light
  description: Activate the staircase light through the configured C300X device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    address:
      name: Stair light address
      description: Optional OpenWebNet staircase-light address. Defaults to the configured integration address.
      required: false
      selector:
        text:

unlock_door:
  name: Unlock C300X door
  description: Unlock a configured C300X door through the local device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    lock_id:
      name: Lock ID
      description: Optional C300X lock id reported by the device agent. Defaults to default.
      required: false
      selector:
        text:

activate_doorbell_video:
  name: Activate C300X doorbell video
  description: Start or renew the C300X doorbell video session through the local device agent. Use this from automations to pre-warm the camera when the doorbell rings.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    audio:
      name: Enable audio
      description: Request the C300X audio path together with video. Required for browser or mobile-app talkback.
      required: false
      default: true
      selector:
        boolean:

stop_doorbell_video:
  name: Stop C300X doorbell video
  description: Stop the active C300X doorbell video session through the local device agent. Use this from cards and ring automations as the call-end action.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

answer_doorbell_call:
  name: Answer C300X doorbell call
  description: Request app-like answering of the active C300X doorbell ring call through the local device agent. Media playback still needs a browser, recorder, or future headless capture consumer.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    audio:
      name: Enable audio
      description: Request the C300X audio path when answering the ring call.
      required: false
      default: true
      selector:
        boolean:

hangup_doorbell_call:
  name: Hang up C300X doorbell call
  description: Hang up the active C300X doorbell ring call through the local device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

capture_doorbell_call:
  name: Capture C300X doorbell call
  description: Record a short MP4 from the C300X doorbell RTSP stream on Home Assistant. Output is allowed only below /media/c300x/ or /config/www/c300x/.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    output_path:
      name: Output path
      description: Absolute MP4 path below /media/c300x/ or /config/www/c300x/. Defaults to /media/c300x/doorbell_<timestamp>.mp4.
      required: false
      selector:
        text:
    duration_seconds:
      name: Duration
      description: Capture duration in seconds.
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 15
          mode: slider
    include_audio:
      name: Include audio
      description: Include the C300X audio track when available.
      required: false
      default: true
      selector:
        boolean:
    announcement_path:
      name: Announcement path
      description: Optional HA-local audio file below /media/c300x/ or /config/www/c300x/ to play through C300X talkback while capturing.
      required: false
      selector:
        text:

start_home_call:
  name: Start C300X home call
  description: Start an app-like in-house call to the C300X through the local device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    duration_seconds:
      name: Duration seconds
      description: Optional maximum call duration. Set 0 or leave empty to keep the call active until stopped or ended remotely.
      required: false
      selector:
        number:
          min: 0
          max: 3600
          mode: box

stop_home_call:
  name: Stop C300X home call
  description: Stop the active app-like in-house call through the local device agent.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

reboot:
  name: Reboot C300X
  description: Schedule a C300X reboot through the local device-agent maintenance API.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

reload_gui:
  name: Reload C300X GUI
  description: Reload the C300X graphical interface through the local device-agent maintenance API.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

play_latest_video_message:
  name: Play latest C300X video message
  description: Play the latest stored C300X answering-machine video message on a media player.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    media_player_entity_id:
      name: Media player
      description: Media player entity that should play the latest video message.
      required: true
      selector:
        entity:
          domain: media_player

play_latest_voice_memo:
  name: Play latest C300X voice memo
  description: Play the latest stored C300X manual voice memo on a media player.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    media_player_entity_id:
      name: Media player
      description: Media player entity that should play the latest voice memo.
      required: true
      selector:
        entity:
          domain: media_player

write_text_memo:
  name: Write C300X text memo
  description: Create a local manual text memo on the C300X. The memo is written only when this service is called.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
    text:
      name: Text
      description: Memo text to store on the C300X. Maximum 512 UTF-8 bytes.
      required: true
      selector:
        text:
          multiline: true
    read:
      name: Mark as read
      description: Store the memo as already read. Leave disabled for a normal unread memo.
      required: false
      default: false
      selector:
        boolean:

delete_latest_video_message:
  name: Delete latest C300X video message
  description: Delete the latest stored C300X answering-machine video message. Requires the C300X GUI function patch.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

delete_latest_text_memo:
  name: Delete latest C300X text memo
  description: Delete the latest stored C300X manual text memo. Requires the C300X GUI function patch.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:

delete_latest_voice_memo:
  name: Delete latest C300X voice memo
  description: Delete the latest stored C300X manual voice memo. Requires the C300X GUI function patch.
  fields:
    entry_id:
      name: Entry ID
      description: Optional config entry id when more than one C300X entry exists.
      required: false
      selector:
        text:
